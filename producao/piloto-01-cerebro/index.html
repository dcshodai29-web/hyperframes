    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #080b12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #fundo {
        position: absolute;
        inset: 0;
        background: #080b12;
        z-index: 0;
      }
      .cena {
        z-index: 2;
      }
      #legendas {
        z-index: 5;
      }
    </style>
