<template>

       ao fundo de olho, com cores naturais; os vasos saem do disco óptico. A camada de
       fotorreceptores acende em toda a retina, menos no disco: o ponto cego. -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #080b12;

      position: absolute;

      position: absolute;

      transform-origin: 50% 0%;
    }
  </style>
  <div id="root" data-composition-id="cena2" data-width="1080" data-height="1920">
    <div id="c2-palco">
      <canvas id="c2-gl" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="c2-fio"></div>
      <p id="c2-nervo" class="c2-rotulo">NERVO ÓPTICO</p>
      <p id="c2-cego" class="c2-rotulo">PONTO CEGO</p>
      <p id="c2-cego-sub" class="c2-rotulo">nenhum fotorreceptor</p>
    </div>
  </div>
  <script>
    (function () {
      const D = 5.84;
      const { fontes, quadro, relogio, curvas } = window.CienciaGL;
      const { entre, saida3, entrada3, suave } = curvas;
      const ret = quadro(document.getElementById("c2-gl"), fontes.RETINA);
      const tl = gsap.timeline({ paused: true });
      relogio(tl, D, (t) => {
        const chega = saida3((t - 0.9) / 1.8); // aproximação do disco
        const disco = [760 + (540 - 760) * chega, 600 + (820 - 600) * chega];
        ret.desenhar({
          uT: t,
          uTunel: entre(t, 0.0, 0.25) * (1 - entre(t, 1.0, 1.6)), // nasce do preto da pupila
          uLente: t < 0.25 ? 0 : 1650 * entrada3((t - 0.25) / 0.6),
          uRetina: entre(t, 0.8, 1.6),
          uCam: [
            disco[0],
            disco[1],
            0.5 + 0.5 * saida3((t - 0.9) / 2.2),
            -0.22 + 0.3 * suave(t / D),
          ],
          uRecep: entre(t, 3.3, 4.7),
          uAnel: entre(t, 4.55, 4.9),
          uPulso: t,
        });
      });
      tl.fromTo(
        "#c2-fio",
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" },
        2.3,
      );
      tl.fromTo(
        "#c2-nervo",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        2.35,
      );
      tl.to(
        "#c2-nervo",
        { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" },
        4.4,
      );
      tl.fromTo(
        "#c2-cego",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        4.6,
      );
      tl.fromTo(
        "#c2-cego-sub",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        4.75,
      );
      // saída: troca por desfoque (o fundo escuro do vídeo nunca corta)
      tl.to(
        "#c2-palco",
        { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" },
        D - 0.27,
      );
      window.__timelines["cena2"] = tl;
    })();
  </script>
