  <script>
    (function () {
      const D = 6.86;
      const { fontes, quadro, relogio, curvas } = window.CienciaGL;
      const { suave } = curvas;
      const olho = quadro(document.getElementById("c5-gl"), fontes.OLHO);
      const tl = gsap.timeline({ paused: true });
      // o olhar começa na página (embaixo, à esquerda) e salta para a direita em "mover"
      const g0 = [-150, 140],
        g1 = [235, -15];
      relogio(tl, D, (t) => {
        const k = suave((t - 1.05) / 0.06);
        olho.desenhar({
          uT: t,
          uCentro: [250, 250],
          uZoom: 0.4,
          uPupila: 1.0,
          uBuraco: 0,
          uOlhar: [g0[0] + (g1[0] - g0[0]) * k, g0[1] + (g1[1] - g0[1]) * k],
          uPoeira: 0,
        });
      });
      // whip-pan: a câmera faz o mesmo salto que o olho e pousa no relógio em "relógio"
      tl.to("#c5-faixa", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 1.95);
      tl.to(
        "#c5-faixa",
        {
          keyframes: [{ filter: "blur(0px)" }, { filter: "blur(18px)" }, { filter: "blur(0px)" }],
          duration: 0.5,
          ease: "none",
        },
        1.95,
      );
      // ponteiro: o primeiro intervalo segura 1,6 s; os seguintes, 1 s cada
