  <script>
    (function () {
      const D = 8.15;
      const { fontes, quadro, pontos, relogio, curvas } = window.CienciaGL;
      const { entre } = curvas;
      const canvas = document.getElementById("c7-gl");
      const mosaico = quadro(canvas, fontes.MOSAICO);
      const particulas = pontos(mosaico.gl, 4200);
      const tl = gsap.timeline({ paused: true });
      relogio(tl, D, (t) => {
        mosaico.desenhar(
          {
            uT: t,
            uCerebro: [470, 600, 255, 205],
            uChegada: entre(t, 1.5, 4.4),
            uSel: entre(t, 4.45, 5.0),
            uComp: entre(t, 5.25, 5.95),
            uMonta: Math.max(0, 1 - Math.abs(t - 6.05) / 0.25) * (t > 5.8 ? 1 : 0),
            uResolve: entre(t, 6.35, 7.4),
            uAlfa: 1 - entre(t, 7.7, 8.0),
          },
          true,
        );
        particulas.desenhar({
          uT: t,
          uOlho: [792, 645],
          uCortex: [300, 640],
          uFluxo: entre(t, 0.7, 1.3) * (1 - entre(t, 6.9, 7.6)),
          uFiltro: 0.06,
        });
      });
      // a quadra encolhe para dentro do cérebro e some no mosaico
      tl.fromTo(
        "#c7-quadro",
        { scale: 1, opacity: 1 },
        { scale: 0.17, duration: 1.25, ease: "power3.inOut" },
        0.1,
      );
      tl.to(
        "#c7-quadro",
        { opacity: 0, filter: "blur(6px)", duration: 0.45, ease: "power2.in" },
        1.05,
      );
      tl.fromTo(
        ["#c7-cabeca-fundo", "#c7-cabeca-linha"],
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        0.35,
      );
      // seleciona · completa · monta
      [
        ["#c7-sel", 4.45],
        ["#c7-comp", 5.25],
        ["#c7-monta", 5.95],
      ].forEach(([id, t]) => {
        tl.fromTo(id, { opacity: 0, color: "#00d9ff" }, { opacity: 1, duration: 0.18 }, t);
        tl.to(id, { color: "#f5f7fa", duration: 0.25 }, t + 0.6);
      });
      tl.to("#c7-palavras", { opacity: 0, duration: 0.25 }, 7.35);
      // mergulho no olho da cabeça: a pupila cresce até cobrir o quadro (a cena 8 começa nela)
      tl.to("#c7-palco", { scale: 6, duration: 0.5, ease: "power3.in" }, D - 0.5);
      tl.fromTo(
        "#c7-pupila",
        { opacity: 0, scale: 1 },
        { opacity: 1, scale: 120, duration: 0.5, ease: "power3.in" },
        D - 0.5,
      );
      window.__timelines["cena7"] = tl;
    })();
