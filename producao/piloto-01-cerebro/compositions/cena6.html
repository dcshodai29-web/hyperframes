      tl.set("#c6-n0", { opacity: 1 }, 0);
      for (let k = 0; k < 10; k++) {
        const t0 = 0.75 + k * 0.78;
        const de = MAOS[ORDEM[k % 3]],
          para = MAOS[ORDEM[(k + 1) % 3]];
        // arco de passe: altura de 80 px no meio do caminho
        const quadros = [0.25, 0.5, 0.75, 1].map((f) => ({
          x: de[0] + (para[0] - de[0]) * f,
          y: de[1] + (para[1] - de[1]) * f - 4 * f * (1 - f) * 80,
        }));
        tl.to("#c6-bola", { keyframes: quadros, duration: 0.5, ease: "none" }, t0);
        tl.set("#c6-n" + k, { opacity: 0 }, t0 + 0.5);
        tl.set("#c6-n" + (k + 1), { opacity: 1 }, t0 + 0.5);
      }
      // movimento dos jogadores: brancos balançam no lugar, pretos se deslocam
      ["w1", "w2", "w3"].forEach((j, i) =>
        tl.fromTo(
          "#c6-" + j,
          { y: 0 },
          { y: -7, duration: 0.39, ease: "sine.inOut", yoyo: true, repeat: 22 },
          0.1 * i,
        ),
      );
      ["k1", "k2", "k3"].forEach((j, i) =>
        tl.fromTo(
          "#c6-" + j,
          { x: 0 },
          { x: i % 2 ? -26 : 26, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 10 },
          0.2 * i,
        ),
      );
      // o gorila entra pela direita, para no centro e bate no peito
      tl.fromTo("#c6-gorila", { x: 0 }, { x: -610, duration: 2.4, ease: "none" }, 2.6);
      tl.fromTo(
        "#c6-gorila",
        { y: 0 },
        { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 },
        2.6,
      );
      tl.set("#c6-bracos-baixo", { opacity: 0 }, 5.4);
      for (let b = 0; b < 7; b++) {
        const t = 5.4 + b * 0.18;
        tl.set("#c6-bate-esq", { opacity: b % 2 ? 0 : 1 }, t);
        tl.set("#c6-bate-dir", { opacity: b % 2 ? 1 : 0 }, t);
      }
      tl.set(["#c6-bate-esq", "#c6-bate-dir"], { opacity: 0 }, 5.4 + 7 * 0.18);
      tl.set("#c6-bracos-baixo", { opacity: 1 }, 5.4 + 7 * 0.18);
      // textos
      tl.fromTo("#c6-selo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      tl.fromTo("#c6-contador", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
      tl.to("#c6-contador", { opacity: 0, duration: 0.25 }, 6.36);
      tl.fromTo(
        "#c6-pct",
        { opacity: 0, scale: 0.92, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" },
        6.35,
      );
      tl.fromTo(
        "#c6-pct-sub",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.25 },
        6.5,
      );
      // "gorila": o foco muda — o gorila fica nítido e iluminado, o resto desfoca; a câmera abre
      tl.to(
        "#c6-gorila-svg",
        { filter: "blur(0px) brightness(1.25)", duration: 0.35, ease: "power2.out" },
        8.68,
      );
      tl.to(
        ["#c6-brancos", "#c6-pretos"],
        { filter: "blur(7px) brightness(0.6)", opacity: 0.55, duration: 0.35, ease: "power2.out" },
        8.68,

      tl.to("#c6-bola-svg", { opacity: 0, duration: 0.3 }, 8.68);
      tl.fromTo(
        "#c6-cena",
        { scale: 1.07 },
        { scale: 1.0, duration: 1.0, ease: "power2.out" },
        8.7,
      );
      // os textos saem antes do corte: a cena 7 continua só com a quadra
      tl.to(
        ["#c6-selo", "#c6-pct", "#c6-pct-sub"],
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        D - 0.3,
